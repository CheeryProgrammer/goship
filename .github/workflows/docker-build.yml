name: Reusable — Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name without tag (e.g. "ghcr.io/org/app")'
        type: string
        required: true
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Docker build context path'
        type: string
        default: '.'
      platforms:
        description: 'Comma-separated target platforms (e.g. "linux/amd64,linux/arm64")'
        type: string
        default: 'linux/amd64'
      build-args:
        description: 'Newline-separated docker build-args (e.g. "VERSION=1.0\nENV=prod")'
        type: string
        default: ''
      push:
        description: 'Push image after build (set true only if registry secrets are provided)'
        type: boolean
        default: false
      registry:
        description: 'Registry host for docker login (e.g. "ghcr.io", "docker.io")'
        type: string
        default: 'ghcr.io'
      cache-from:
        description: 'Cache source (passed to --cache-from). Leave empty to disable.'
        type: string
        default: 'type=gha'
      cache-to:
        description: 'Cache destination (passed to --cache-to). Leave empty to disable.'
        type: string
        default: 'type=gha,mode=max'
      artifact-name:
        description: 'Name of a previously built binary artifact to download before build'
        type: string
        default: ''
      runner:
        description: 'GitHub Actions runner label'
        type: string
        default: 'ubuntu-latest'
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry login username (required when push is true)'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry login password/token (required when push is true)'
        required: false
    outputs:
      image-tag:
        description: 'Primary image tag produced by the build'
        value: ${{ jobs.docker-build.outputs.image-tag }}
      image-digest:
        description: 'Image digest (sha256:...)'
        value: ${{ jobs.docker-build.outputs.image-digest }}

jobs:
  docker-build:
    name: Docker Build
    runs-on: ${{ inputs.runner }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary artifact
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./bin/

      - name: Make binary executable
        if: ${{ inputs.artifact-name != '' }}
        run: chmod +x ./bin/*

      - name: Log in to ${{ inputs.registry }}
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | buildah login \
            --username "$REGISTRY_USERNAME" \
            --password-stdin \
            "$REGISTRY"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and optionally push)
        id: build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          BUILD_ARG_FLAGS=()
          while IFS= read -r arg; do
            [ -n "$arg" ] && BUILD_ARG_FLAGS+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS"

          LABEL_FLAGS=()
          while IFS= read -r lbl; do
            [ -n "$lbl" ] && LABEL_FLAGS+=(--label "$lbl")
          done <<< "$META_LABELS"

          MANIFEST_NAME="goship-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          buildah manifest rm "$MANIFEST_NAME" 2>/dev/null || true

          buildah build \
            --jobs=2 \
            --platform="${{ inputs.platforms }}" \
            --manifest "$MANIFEST_NAME" \
            --file "${{ inputs.dockerfile }}" \
            "${BUILD_ARG_FLAGS[@]}" \
            "${LABEL_FLAGS[@]}" \
            "${{ inputs.context }}"

          if [ "${{ inputs.push }}" = "true" ]; then
            DIGEST_FILE=$(mktemp)
            PUSHED_TAGS=()
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                # This exit-code check is already covered by `set -e` (the push is the
                # last command in this branch); it exists to print a clear ::error:: with
                # the offending tag instead of a bare non-zero exit. It does NOT protect
                # against buildah exhausting its retries and still returning 0 — that
                # case is only caught by the registry-resolve check in the next step.
                if ! buildah manifest push --all --format v2s2 \
                  --digestfile "$DIGEST_FILE" \
                  "$MANIFEST_NAME" "docker://$tag"; then
                  echo "::error::buildah manifest push failed for docker://$tag (registry push failed or exhausted retries)" >&2
                  exit 1
                fi
                PUSHED_TAGS+=("$tag")
              fi
            done <<< "$META_TAGS"
            echo "digest=$(cat "$DIGEST_FILE")" >> "$GITHUB_OUTPUT"

            {
              echo "pushed-tags<<PUSHED_TAGS_EOF"
              printf '%s\n' "${PUSHED_TAGS[@]}"
              echo "PUSHED_TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          buildah manifest rm "$MANIFEST_NAME" 2>/dev/null || true

      - name: Verify pushed image resolves in registry
        if: ${{ inputs.push }}
        env:
          PUSHED_TAGS: ${{ steps.build.outputs.pushed-tags }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          # `buildah manifest inspect` only reads local manifest lists and rejects a
          # docker:// transport ("unsupported transport ... for looking up local
          # images"), so it cannot be used here. skopeo (same containers/image family
          # as buildah, and it shares buildah's auth file) does hit the registry, so
          # prefer it when present; otherwise fall back to a raw registry API v2 call.
          if [ -z "$PUSHED_TAGS" ]; then
            echo "::error::push was requested but no tags were recorded as pushed" >&2
            exit 1
          fi

          USE_SKOPEO=0
          if command -v skopeo >/dev/null 2>&1; then
            USE_SKOPEO=1
            echo "skopeo found on this runner — using it to verify pushed manifests."
          else
            echo "skopeo not found on this runner — falling back to a direct registry API v2 check."
          fi

          resolve_via_skopeo() {
            skopeo inspect --raw "docker://$1"
          }

          # Generic OCI Distribution Spec bearer-token flow: try anonymously, and on
          # 401 fetch a token from the realm advertised in WWW-Authenticate. Works
          # against any compliant registry (ghcr.io, docker.io, ...), not just ghcr.io.
          resolve_via_registry_api() {
            local tag="$1"
            local repo="${tag#"${REGISTRY}/"}"
            local ref="${repo##*:}"
            repo="${repo%:"${ref}"}"
            local accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
            local url="https://${REGISTRY}/v2/${repo}/manifests/${ref}"

            local headers status
            headers=$(curl -sS -D - -o /dev/null -H "Accept: ${accept}" "$url") || return 1
            status=$(printf '%s' "$headers" | head -n1 | tr -d '\r' | awk '{print $2}')

            [ "$status" = "200" ] && return 0
            if [ "$status" != "401" ]; then
              echo "unexpected HTTP $status from $url" >&2
              return 1
            fi

            local www_auth realm service scope token_response token
            www_auth=$(printf '%s' "$headers" | grep -i '^www-authenticate:' | head -n1 || true)
            realm=$(printf '%s' "$www_auth" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
            service=$(printf '%s' "$www_auth" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
            scope=$(printf '%s' "$www_auth" | sed -n 's/.*scope="\([^"]*\)".*/\1/p')
            [ -z "$scope" ] && scope="repository:${repo}:pull"
            if [ -z "$realm" ]; then
              echo "no WWW-Authenticate realm in 401 response from $url" >&2
              return 1
            fi

            token_response=$(curl -sS -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
              --get "$realm" \
              --data-urlencode "service=${service}" \
              --data-urlencode "scope=${scope}") || return 1
            token=$(printf '%s' "$token_response" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            [ -z "$token" ] && token=$(printf '%s' "$token_response" | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ -z "$token" ]; then
              echo "failed to obtain registry auth token from $realm" >&2
              return 1
            fi

            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Accept: ${accept}" -H "Authorization: Bearer ${token}" "$url") || return 1
            [ "$status" = "200" ]
          }

          MAX_ATTEMPTS=5

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Resolving docker://$tag against the registry (manifest HEAD)..."
            attempt=1
            while true; do
              if [ "$USE_SKOPEO" = "1" ]; then
                INSPECT_OUTPUT=$(resolve_via_skopeo "$tag" 2>&1) && break
              else
                INSPECT_OUTPUT=$(resolve_via_registry_api "$tag" 2>&1) && break
              fi
              if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                echo "$INSPECT_OUTPUT" >&2
                echo "::error::Tag $tag does not resolve in the registry after $MAX_ATTEMPTS attempts — the push likely failed silently (e.g. exhausted retries) even though the push step reported success." >&2
                exit 1
              fi
              delay=$((2 ** attempt))
              echo "Attempt $attempt/$MAX_ATTEMPTS failed, retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          done <<< "$PUSHED_TAGS"
