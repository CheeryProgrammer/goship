name: Reusable — Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name without tag (e.g. "ghcr.io/org/app")'
        type: string
        required: true
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Docker build context path'
        type: string
        default: '.'
      platforms:
        description: 'Comma-separated target platforms (e.g. "linux/amd64,linux/arm64")'
        type: string
        default: 'linux/amd64'
      build-args:
        description: 'Newline-separated docker build-args (e.g. "VERSION=1.0\nENV=prod")'
        type: string
        default: ''
      push:
        description: 'Push image after build (set true only if registry secrets are provided)'
        type: boolean
        default: false
      registry:
        description: 'Registry host for docker login (e.g. "ghcr.io", "docker.io")'
        type: string
        default: 'ghcr.io'
      cache-from:
        description: 'Cache source (passed to --cache-from). Leave empty to disable.'
        type: string
        default: 'type=gha'
      cache-to:
        description: 'Cache destination (passed to --cache-to). Leave empty to disable.'
        type: string
        default: 'type=gha,mode=max'
      artifact-name:
        description: 'Name of a previously built binary artifact to download before build'
        type: string
        default: ''
      runner:
        description: 'GitHub Actions runner label'
        type: string
        default: 'ubuntu-latest'
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry login username (required when push is true)'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry login password/token (required when push is true)'
        required: false
    outputs:
      image-tag:
        description: 'Primary image tag produced by the build'
        value: ${{ jobs.docker-build.outputs.image-tag }}
      image-digest:
        description: 'Image digest (sha256:...)'
        value: ${{ jobs.docker-build.outputs.image-digest }}

jobs:
  docker-build:
    name: Docker Build
    runs-on: ${{ inputs.runner }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary artifact
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./bin/

      - name: Make binary executable
        if: ${{ inputs.artifact-name != '' }}
        run: chmod +x ./bin/*

      - name: Log in to ${{ inputs.registry }}
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | buildah login \
            --username "$REGISTRY_USERNAME" \
            --password-stdin \
            "$REGISTRY"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and optionally push)
        id: build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          BUILD_ARG_FLAGS=()
          while IFS= read -r arg; do
            [ -n "$arg" ] && BUILD_ARG_FLAGS+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS"

          LABEL_FLAGS=()
          while IFS= read -r lbl; do
            [ -n "$lbl" ] && LABEL_FLAGS+=(--label "$lbl")
          done <<< "$META_LABELS"

          MANIFEST_NAME="goship-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          buildah manifest rm "$MANIFEST_NAME" 2>/dev/null || true

          buildah build \
            --jobs=2 \
            --platform="${{ inputs.platforms }}" \
            --manifest "$MANIFEST_NAME" \
            --file "${{ inputs.dockerfile }}" \
            "${BUILD_ARG_FLAGS[@]}" \
            "${LABEL_FLAGS[@]}" \
            "${{ inputs.context }}"

          if [ "${{ inputs.push }}" = "true" ]; then
            DIGEST_FILE=$(mktemp)
            PUSHED_TAGS=()
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                # buildah's built-in retry-on-timeout logic has been observed to exhaust
                # its retries against a slow/flaky registry, log the final attempt as a
                # "Failed, retrying in Ns ... (n/n)" warning, and still exit 0 — so the
                # exit code here must be checked explicitly rather than trusted implicitly.
                if ! buildah manifest push --all --format v2s2 \
                  --digestfile "$DIGEST_FILE" \
                  "$MANIFEST_NAME" "docker://$tag"; then
                  echo "::error::buildah manifest push failed for docker://$tag (registry push failed or exhausted retries)" >&2
                  exit 1
                fi
                PUSHED_TAGS+=("$tag")
              fi
            done <<< "$META_TAGS"
            echo "digest=$(cat "$DIGEST_FILE")" >> "$GITHUB_OUTPUT"

            {
              echo "pushed-tags<<PUSHED_TAGS_EOF"
              printf '%s\n' "${PUSHED_TAGS[@]}"
              echo "PUSHED_TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          buildah manifest rm "$MANIFEST_NAME" 2>/dev/null || true

      - name: Verify pushed image resolves in registry
        if: ${{ inputs.push }}
        env:
          PUSHED_TAGS: ${{ steps.build.outputs.pushed-tags }}
        run: |
          set -euo pipefail

          if [ -z "$PUSHED_TAGS" ]; then
            echo "::error::push was requested but no tags were recorded as pushed" >&2
            exit 1
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Resolving docker://$tag against the registry (manifest HEAD)..."
            if ! INSPECT_OUTPUT=$(buildah manifest inspect "docker://$tag" 2>&1); then
              echo "$INSPECT_OUTPUT" >&2
              echo "::error::Tag $tag does not resolve in the registry right after push — the push likely failed silently (e.g. exhausted retries) even though the push step reported success." >&2
              exit 1
            fi
          done <<< "$PUSHED_TAGS"
